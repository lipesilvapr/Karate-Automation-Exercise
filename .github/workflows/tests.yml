name: Karate Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Info da máquina
        run: |
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
          nproc
          free -m
          df -h /
          lscpu | grep -E "Model name|^CPU\(s\)" || true
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: mvn -B test -Dtest=ApiTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: karate-reports-api
          path: target/karate-reports/api

  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Info da máquina
        run: |
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
          nproc
          free -m
          df -h /
          lscpu | grep -E "Model name|^CPU\(s\)" || true
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: mvn -B test -Dtest=UiTest -Dci=true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: karate-reports-ui
          path: target/karate-reports/ui
