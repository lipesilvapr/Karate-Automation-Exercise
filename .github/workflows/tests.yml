name: Karate Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      use_cache:
        description: "Cache de dependências (true = execução a quente, false = a frio)"
        type: choice
        options: ["true", "false"]
        default: "true"

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Info da máquina
        run: |
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
          nproc
          free -m
          df -h /
          lscpu | grep -E "Model name|^CPU\(s\)" || true
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: ${{ inputs.use_cache != 'false' && 'maven' || '' }}
      - name: Executar testes (medido)
        uses: lipesilvapr/tcc-metricas/.github/actions/measure@main
        with:
          projeto: karate
          camada: api
          command: mvn -B test -Dtest=ApiTest
          junit-glob: target/karate-reports/api/*.xml
          expected-tests: "14"
          cache: ${{ inputs.use_cache || 'true' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: karate-reports-api
          path: target/karate-reports/api

  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Info da máquina
        run: |
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
          nproc
          free -m
          df -h /
          lscpu | grep -E "Model name|^CPU\(s\)" || true
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: ${{ inputs.use_cache != 'false' && 'maven' || '' }}
      - name: Executar testes (medido)
        uses: lipesilvapr/tcc-metricas/.github/actions/measure@main
        with:
          projeto: karate
          camada: ui
          command: mvn -B test -Dtest=UiTest -Dci=true
          junit-glob: target/karate-reports/ui/*.xml
          expected-tests: "10"
          cache: ${{ inputs.use_cache || 'true' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: karate-reports-ui
          path: target/karate-reports/ui
